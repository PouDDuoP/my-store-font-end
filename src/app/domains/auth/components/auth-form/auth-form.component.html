<div class="max-w-md mx-auto mt-8 p-6 border-2 border-emerald-dark bg-white">
  <h2 class="text-2xl font-bold mb-6 text-emerald-dark font-display">{{ title() }}</h2>
  <form (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-4">
      <label for="email" class="block mb-2 text-emerald-dark font-medium font-display">{{ 'auth.user' | translate }}</label>
        <input 
          id="email" 
          type="email" 
          [ngModel]="email()" 
          (ngModelChange)="email.set($event)"
          [ngModelOptions]="{standalone: true}"
          required 
          autocomplete="email"
          [attr.aria-label]="'auth.user' | translate"
          class="w-full p-3 border-2 border-emerald-dark focus:ring-2 focus:ring-accent focus:border-emerald-dark transition-colors duration-100"
        />
    </div>
    <div class="mb-6">
      <label for="password" class="block mb-2 text-emerald-dark font-medium font-display">{{ 'auth.password' | translate }}</label>
        <input 
          id="password" 
          type="password" 
          [ngModel]="password()" 
          (ngModelChange)="password.set($event)"
          [ngModelOptions]="{standalone: true}"
          required 
          autocomplete="current-password"
          [attr.aria-label]="'auth.password' | translate"
          class="w-full p-3 border-2 border-emerald-dark focus:ring-2 focus:ring-accent focus:border-emerald-dark transition-colors duration-100"
        />
    </div>
    <button 
      type="submit" 
      class="btn-emerald w-full py-3 px-4"
      [attr.aria-label]="loginType() === 'login' ? ('auth.signIn' | translate) : ('auth.createAccount' | translate)"
    >
      {{ loginType() === 'login' ? ('auth.signIn' | translate) : ('auth.createAccount' | translate) }}
    </button>
  </form>
</div>
