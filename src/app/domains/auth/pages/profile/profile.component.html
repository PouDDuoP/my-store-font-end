<div class="max-w-md mx-auto mt-8 p-6 border-2 border-emerald-dark shadow-[4px_4px_0px_#000]">
  <h2 class="text-2xl font-bold mb-6 text-emerald-dark font-display">{{ 'profile.title' | translate }}</h2>
  <p class="mb-4 text-emerald-dark">{{ 'profile.loggedInAs' | translate }} {{ userEmail() }}</p>
  <button (click)="logout()" class="btn-emerald py-2 px-4">
    {{ 'profile.logout' | translate }}
  </button>
</div>
