<div class="w-full max-w-sm bg-emerald-dark border-2 border-accent shadow-[4px_4px_0px_#000] hover:shadow-[6px_6px_0px_#000] hover:translate-x-[-2px] hover:translate-y-[-2px] transition-all duration-100">
    <!-- Image Carousel -->
    <a [routerLink]="['/product', product().id]" class="block overflow-hidden border-b-2 border-emerald-dark">
        <app-image-carousel
            [images]="images()"
            [alt]="productName()"
            class="block"
        />
    </a>

    <div class="px-5 pb-5">
        <!-- Product Name -->
        <a [routerLink]="['/product', product().id]">
            <h5 class="text-xl font-semibold tracking-tight text-emerald-soft hover:text-white transition-colors font-display">
                {{ product().name | uppercase | reverse }}
            </h5>
        </a>

        <!-- Created date -->
        <span class="text-sm font-medium text-text/70">
            {{ product().createdAt | timeAgo }}
        </span>

        <!-- Price and Add to Cart -->
        <div class="flex items-center justify-between mt-4">
            <span class="text-3xl font-bold text-emerald-soft">
                {{ product().price | currency:'$':'symbol':'1.2' }}
            </span>
            <button
                type="button"
                class="btn-emerald px-5 py-2.5 text-sm"
                (click)="addToCartHandler()"
                [attr.aria-label]="'product.addToCartAria' | translate:{name: product().name}"
            >
                {{ 'product.addToCart' | translate }}
            </button>
        </div>
    </div>
</div>
