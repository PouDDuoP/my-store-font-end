<div class="relative w-full max-w-md">
  <label for="search-input" class="sr-only">{{ 'search.placeholder' | translate }}</label>
  <div class="relative">
    <!-- Search icon -->
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-emerald-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
      </svg>
    </div>

    <!-- Search input -->
    <input
      #searchInput
      id="search-input"
      type="text"
      [placeholder]="placeholder() | translate"
      (input)="onInput($event)"
      [attr.aria-label]="'search.placeholder' | translate"
      class="block w-full pl-10 pr-10 py-2 border-2 border-emerald-dark bg-white text-emerald-dark placeholder-emerald-dark/50 focus:outline-none focus:ring-2 focus:ring-accent focus:border-emerald-dark transition-colors duration-100"
    />

    <!-- Clear button -->
    @if (searchQuery()) {
      <button
        type="button"
        (click)="clearSearch()"
        aria-label="{{ 'search.clear' | translate }}"
        class="absolute inset-y-0 right-0 pr-3 flex items-center text-emerald-dark hover:text-accent focus:outline-none focus:text-accent"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
        </svg>
      </button>
    }
  </div>
</div>
